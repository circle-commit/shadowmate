<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowmate</title>
<link rel="icon" href="icons/icon32.png">
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #171719; --muted: #626268; --line: #dddddf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #28282a; --text: #f5f5f7; --muted: #b0b0b8; --line: #414145; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.75 system-ui, sans-serif; overflow-wrap: anywhere; }
  main { max-width: 680px; margin: auto; padding: 40px 20px 64px; }
  .app-icon { display: block; margin: 0 0 8px -9px; }
  h1 { font-size: 30px; line-height: 1.3; margin: 0; }
  .lead { color: var(--muted); }
  h2 { margin: 32px 0 8px; font-size: 17px; }
  section p { margin: 0; padding: 16px; background: var(--card); border-radius: 12px; white-space: pre-line; }
  dl { background: var(--card); border-radius: 12px; padding: 4px 16px; }
  .key-row { display: flex; align-items: baseline; gap: 20px; padding: 10px 0; }
  .key-row + .key-row { border-top: 1px solid var(--line); }
  dt { flex: 0 0 38px; } dd { margin: 0; }
  kbd { display: inline-block; text-align: center; min-width: 24px; border: 1px solid var(--line); border-radius: 5px; font: inherit; }
</style>
<main id="localized-guide"></main>
<script src="guide.js"></script>
</html>
